name: Build Prebuilt Libraries

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact_prefix:
        description: 'Prefix used for uploaded artifacts'
        value: 'zvec-prebuilt'

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
            lib_name: libzvec_c_api.dylib
            container: ''
            uname_m: arm64
            # macOS 14.0 baseline, same as the artifacts published so far.
            macos_deployment_target: '14.0'
          # Intel macOS, built natively on GitHub's macos-15-intel runner — the
          # same runner upstream zvec uses for its osx-amd64 SDK
          # (_build_macos_x64_sdk.yml), its macos-x64 CI job and its x86_64
          # wheels. The 11.0 baseline matches upstream's osx-amd64 SDK: Intel
          # Macs top out at macOS 15 and many still run Big Sur/Monterey.
          - target: x86_64-apple-darwin
            os: macos-15-intel
            lib_name: libzvec_c_api.dylib
            container: ''
            uname_m: x86_64
            macos_deployment_target: '11.0'
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            lib_name: libzvec_c_api.so
            # Pinned dated tag, same batch as upstream zvec's
            # _build_prebuilt.yml. manylinux_2_28 = glibc 2.28, so the
            # prebuilt .so works on glibc distros as old as CentOS 8 /
            # Ubuntu 20.04.
            container: 'quay.io/pypa/manylinux_2_28_x86_64:2026.03.01-1'
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            lib_name: libzvec_c_api.so
            # Same glibc 2.28 baseline as the x86_64 gnu build (upstream
            # builds this target in the same container family).
            container: 'quay.io/pypa/manylinux_2_28_aarch64:2026.03.01-1'
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            lib_name: libzvec_c_api.so
            # musllinux_1_2 (Alpine/musl) covers musl distros, pinned to the
            # same tag as upstream zvec's _build_prebuilt.yml and its
            # 09-musllinux-build.yml CI job.
            container: 'quay.io/pypa/musllinux_1_2_x86_64:2026.03.01-1'
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            lib_name: libzvec_c_api.so
            container: 'quay.io/pypa/musllinux_1_2_aarch64:2026.03.01-1'
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            lib_name: zvec_c_api.dll
            container: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup sccache
        # Not on Windows: bundled Arrow's CMake auto-detects sccache on PATH and
        # wraps lib.exe/link.exe, stalling on the huge tail libs (see ci.yml).
        if: runner.os != 'Windows'
        uses: mozilla-actions/sccache-action@v0.0.10

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Linux builds run inside pinned pypa containers, aligned with upstream
      # zvec's _build_prebuilt.yml: manylinux_2_28 (glibc 2.28) for the gnu
      # targets, musllinux_1_2 (musl) for the musl targets. Mount the entire
      # workspace (not just vendor/zvec) so that submodule .git files can
      # resolve to the parent repo's .git/modules/ directory — needed by
      # zvec's apply_patch_once() which calls `git apply` inside arrow.
      - name: Build zvec C library (Linux gnu, manylinux_2_28 / glibc 2.28)
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace/vendor/zvec \
            "${{ matrix.container }}" \
            bash -c "
              dnf install -y cmake gcc-c++ git libaio-devel
              mkdir -p build && cd build
              cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DBUILD_C_BINDINGS=ON -DBUILD_TOOLS=OFF
              cmake --build . --config Release -j\$(nproc)
            "
        shell: bash

      - name: Build zvec C library (Linux musl, musllinux_1_2)
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace/vendor/zvec \
            "${{ matrix.container }}" \
            bash -c '
              # The image ships CPython under /opt/python; install pinned
              # cmake 3.30.0 + ninja via its pip so they shadow the
              # image-bundled CMake 4.x — same approach as the upstream
              # zvec musllinux jobs.
              PYBIN=$(ls -d /opt/python/cp3*/bin 2>/dev/null | head -1)
              export PATH="$PYBIN:$PATH"
              python -m pip install --upgrade pip
              python -m pip install cmake==3.30.0 ninja==1.11.1
              mkdir -p build && cd build
              cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_C_BINDINGS=ON -DBUILD_TOOLS=OFF
              cmake --build . --config Release --parallel $(nproc)
            '
        shell: bash

      # macOS: build via scikit-build (pip), which places the outputs under
      # vendor/zvec/build like the container builds above. Every architecture
      # builds natively on its own runner (arm64 on macos-15, x86_64 on
      # macos-15-intel), so no cross-compilation toolchain is involved.
      - name: Build zvec C library (macOS)
        if: runner.os == 'macOS'
        run: |
          # A mislabelled runner would silently produce a library for the wrong
          # slice, so pin the expectation down before spending an hour on it.
          test "$(uname -m)" = "${{ matrix.uname_m }}"

          cd vendor/zvec

          NPROC=$(sysctl -n hw.ncpu 2>/dev/null || echo 2)

          python -m pip install --upgrade pip pybind11==3.0 cmake==3.30.0 ninja==1.11.1 scikit-build-core setuptools_scm

          # Deployment target comes from the matrix (see the comments there):
          # CMake picks it up from the environment and stamps it into the
          # linked dylib as its minimum OS version.
          export MACOSX_DEPLOYMENT_TARGET="${{ matrix.macos_deployment_target }}"

          CMAKE_GENERATOR="Unix Makefiles" \
          CMAKE_BUILD_PARALLEL_LEVEL="$NPROC" \
          python -m pip install -v . \
            --no-build-isolation \
            --config-settings='cmake.define.BUILD_TOOLS="ON"'
        shell: bash

      # Fail loudly if the macOS library is not the slice the target names, or
      # if the deployment baseline drifted away from the matrix entry. Mirrors
      # the architecture check in upstream zvec's _build_macos_x64_sdk.yml.
      - name: Verify library architecture (macOS)
        if: runner.os == 'macOS'
        run: |
          LIB="$(find vendor/zvec/build -name '${{ matrix.lib_name }}' | head -1)"
          test -n "$LIB"
          echo "$LIB: $(lipo -archs "$LIB")"
          lipo -archs "$LIB" | tr ' ' '\n' | grep -Fx '${{ matrix.uname_m }}'
          otool -l "$LIB" | grep -A4 LC_BUILD_VERSION | grep -E 'platform|minos'
        shell: bash

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CMake and Ninja (Windows)
        # Pin the same versions ci.yml uses; cmake 3.30.0 (not 4.x) avoids the
        # old cmake_minimum_required policy errors.
        if: runner.os == 'Windows'
        run: pip install cmake==3.30.0 ninja==1.11.1
        shell: pwsh

      - name: Build zvec C library (Windows)
        if: runner.os == 'Windows'
        run: |
          cd vendor/zvec
          mkdir build -ErrorAction SilentlyContinue
          cd build
          # Fully aligned with ci.yml / zvec-go's proven Windows build: minimal
          # flags, pwsh, pinned cmake/ninja, no sccache. The previous
          # BUILD_*_SHARED=OFF / CMAKE_MSVC_RUNTIME_LIBRARY overrides changed the
          # tail link behaviour and stalled the build for hours.
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_C_BINDINGS=ON -G Ninja
          cmake --build . --config Release --parallel --target zvec_c_api
        shell: pwsh

      - name: Package library (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          ZVEC_LIB_DIR="$(find vendor/zvec/build -name '${{ matrix.lib_name }}' -exec dirname {} \; | head -1)"
          cp "$ZVEC_LIB_DIR/${{ matrix.lib_name }}" dist/
          # Also copy any symlinks or versioned libraries
          find "$ZVEC_LIB_DIR" -name 'libzvec_c_api*' -exec cp -P {} dist/ \; 2>/dev/null || true
          # Bundle cppjieba's dictionary files so the `jieba` FTS tokenizer
          # works out of the box (same layout as the upstream zvec SDK:
          # data/jieba_dict next to the library).
          mkdir -p dist/data/jieba_dict
          cp vendor/zvec/thirdparty/cppjieba/cppjieba-5.6.7/dict/jieba.dict.utf8 \
             vendor/zvec/thirdparty/cppjieba/cppjieba-5.6.7/dict/hmm_model.utf8 \
             dist/data/jieba_dict/
          echo "${{ matrix.target }}" > dist/TARGET
          tar czf zvec-prebuilt-${{ matrix.target }}.tar.gz -C dist .
          ls -lh zvec-prebuilt-${{ matrix.target }}.tar.gz
          ls -l dist/data/jieba_dict
        shell: bash

      - name: Package library (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist
          # Find the DLL and import lib
          find vendor/zvec/build -name 'zvec_c_api.dll' -exec cp {} dist/ \; 2>/dev/null || true
          find vendor/zvec/build -name 'zvec_c_api.lib' -exec cp {} dist/ \; 2>/dev/null || true
          find vendor/zvec/build -name 'zvec_c_api.dll' -path '*/Release/*' -exec cp {} dist/ \; 2>/dev/null || true
          find vendor/zvec/build -name 'zvec_c_api.lib' -path '*/Release/*' -exec cp {} dist/ \; 2>/dev/null || true
          # Bundle cppjieba's dictionary files so the `jieba` FTS tokenizer
          # works out of the box (same layout as the upstream zvec SDK:
          # data/jieba_dict next to the library).
          mkdir -p dist/data/jieba_dict
          cp vendor/zvec/thirdparty/cppjieba/cppjieba-5.6.7/dict/jieba.dict.utf8 \
             vendor/zvec/thirdparty/cppjieba/cppjieba-5.6.7/dict/hmm_model.utf8 \
             dist/data/jieba_dict/
          echo "${{ matrix.target }}" > dist/TARGET
          tar czf zvec-prebuilt-${{ matrix.target }}.tar.gz -C dist .
          ls -lh zvec-prebuilt-${{ matrix.target }}.tar.gz
          ls -l dist/data/jieba_dict
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zvec-prebuilt-${{ matrix.target }}
          path: zvec-prebuilt-${{ matrix.target }}.tar.gz
          retention-days: 7
